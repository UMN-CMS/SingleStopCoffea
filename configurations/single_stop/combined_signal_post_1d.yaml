{% import 'postprocessors/combined_2d.yaml' as comb2D %}
{% import 'postprocessors/combined_1d.yaml' as comb1D %}

Postprocessing:
  processors:
    - name: DumpCombined
      inputs: 
        - "*/*/*/uncomp_mStop" 
        - "*/*/*/comp_mStop" 
        - "*/*/*/verycomp_mStop" 
      era_name: '2018'
      era_energy: 13 
      dataset_name: 'sm_background_2018'
      dataset_title: 'SM Bkg' 
      structure:
        select: {dataset_name: "[!ds]*2018*"}
        group: {pipeline: "*"}
        transforms:
          - name: MergeAxes
            merge_axis_names: ["HT_Cat"]
            should_run:
              sample_type: MC 
          - name: SelectAxesValues
            select_axes_values: {"variation": "central"}
      output_name: "{prefix}/{pipeline}/2018/sm_bkg/{name}.pklz4"

    - name: Dump
      inputs: 
        - "*/*/*/uncomp_mStop" 
        - "*/*/*/comp_mStop" 
        - "*/*/*/verycomp_mStop" 
      structure:
        group: {dataset_name: "signal*", era.name: "*", pipeline: "*"}
        transforms: 
          - name: NormalizeSystematicByProjection
            normalize_within: ["HT_Cat"]
            pre_sf_name: "bjetshapesf-variation_disabled"
            variation_axis: "variation"
            should_run:
              dataset_name: "signal*"
          - name: MergeAxes
            merge_axis_names: ["HT_Cat"]
            should_run:
              sample_type: "MC"
      output_name: "{prefix}/filtered_signals_1d_verycomp_pt_cuts/{era.name}/{pipeline}/{dataset_name}/{name}.pklz4"

    - name: DumpCombined
