    - name: Histogram1DCombined
      inputs:
        - "*/*/*/*mChi*" 
        - "*/*/*/*mStop*"
        - "*/*/*/HT"
        - "*/*/*/NJets"
        - "*/*/*/goodjet*"
      override_meta: True
      era_name: "2018" 
      dataset_title: "SM Background" 
      dataset_name: "sm_background_2018" 
      era_energy: 13 
      structure:
        select: {dataset_name: "[!s]*2018*"}
        group: {pipeline: "*", name: "*"}
        transforms:
          - name: NormalizeSystematicByProjection
            normalize_within: ["HT_Cat"]
            pre_sf_name: "bjetshapesf-variation_disabled"
            variation_axis: "variation"
            should_run:
              dataset_name: "signal*"
          - name: MergeAxes
            merge_axis_names: ["HT_Cat"]
            should_run:
              sample_type: MC 
          - name: SelectAxesValues
            select_axes_values: 
              variation: ["central"]
      output_name: "{prefix}/{pipeline}/2018/combined_background/{name}.png"
