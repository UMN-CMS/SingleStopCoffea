    - name: RatioPlot 
      inputs:
        - "*/*/*/*mChi*" 
        - "*/*/*/*mStop*"
        - "*/*/*/HT"
        - "*/*/*/NJets"
        - "*/*/*/goodjet*"
      scale: log
      normalize: False
      structure:
        select: {dataset_name: "*"}
        group: {pipeline: "*", name: "*", era.name: "*"}
        subgroups:
          denominator:
            #select: {dataset_name: '[!s]*'}
            select: {dataset_name: 'qcd*'}
          numerator:
            select: {dataset_name: 'signal*1700_1650*'}
        transforms:
          - name: NormalizeSystematicByProjection
            normalize_within: ["HT_Cat"]
            pre_sf_name: "bjetshapesf-variation_disabled"
            variation_axis: "variation"
            should_run:
              dataset_name: "signal*"
          - name: MergeAxes
            merge_axis_names: ["HT_Cat"]
            should_run:
              sample_type: MC 
          - name: SelectAxesValues
            select_axes_values: 
              variation: ["central"]
      output_name: "{prefix}/{pipeline}/{era.name}/ratio_{name}.pdf"
