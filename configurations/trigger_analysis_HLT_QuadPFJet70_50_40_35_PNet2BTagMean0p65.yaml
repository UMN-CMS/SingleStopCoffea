
analyzer:
  default_run_builder:
    strategy_name: NoSystematics

  quad_pipeline:   
        
    - module_name: JetFilter # Make a column of the good jets/event
      input_col: Jet
      output_col: GoodJet

    - module_name: NObjFilter #Spec that I want at least 4 
      selection_name: 'FourPlusGoodJets'
      input_col: GoodJet
      min_count: 4     

    - module_name: SelectOnColumns
      sel_name: 'FourJetsMinimum'


    - module_name: PromoteIndex
      input_col: GoodJet
      output_col: FirstGoodJet
      index: 0

    - module_name: ScalarSelection
      selection_name: 'LeadingJetGreater70GeV'
      input_col: FirstGoodJet.pt
      cut_val: 70

    - module_name: PromoteIndex
      input_col: GoodJet
      output_col: SecondGoodJet
      index: 1

    - module_name: ScalarSelection
      selection_name: 'Jet2Greater50GeV'
      input_col: SecondGoodJet.pt
      cut_val: 50

    - module_name: PromoteIndex
      input_col: GoodJet
      output_col: ThirdGoodJet
      index: 2

    - module_name: ScalarSelection
      selection_name: 'Jet3Greater40GeV'
      input_col: ThirdGoodJet.pt
      cut_val: 40

    - module_name: PromoteIndex
      input_col: GoodJet
      output_col: FourthGoodJet
      index: 3

    - module_name: ScalarSelection
      selection_name: 'Jet4Greater30GeV'
      input_col: FourthGoodJet.pt
      cut_val: 30

    - module_name: SelectOnColumns
      sel_name: 'JetSpecSelection'

    - module_name: SimpleCategory # Pass/Fail Category
      input_col: "HLT.QuadPFJet70_50_40_35_PNet2BTagMean0p65"
      cat_name: PassQuad
      bins: 2
      start: 0
      stop: 2

    - module_name: SimpleHistogram
      hist_name: PT4
      input_cols: [FourthGoodJet.pt]
      axes:
        - name: 'PT'
          start: 25.0
          stop: 100.0
          bins: 25
          unit: GeV   
     
    - module_name: BQuarkMaker
      input_col: GoodJet
      output_col: BGoodJet
      working_point: 'T'

    - module_name: NObjFilter
      selection_name: TwoBJet
      input_col: BGoodJet
      min_count: 2

    - module_name: SelectTopN
      input_col: GoodJet        
      sort_field: pt
      n: 4
      output_col: GoodJet_top4pt

    - module_name: SortByBtagScore
      input_col: GoodJet_top4pt
      btag_field: btagDeepFlavB       # Does the PNetB Exist???
      output_col: GoodJet_top4pt_btagsorted

    - module_name: PromoteIndex
      input_col: GoodJet_top4pt_btagsorted.btagDeepFlavB
      output_col: GoodJet_Brankone
      index: 0

    - module_name: PromoteIndex
      input_col: GoodJet_top4pt_btagsorted.btagDeepFlavB
      output_col: GoodJet_Branktwo
      index: 1

    - module_name: BtagDisc
      input_col_first_rank: GoodJet_Brankone
      input_col_second_rank: GoodJet_Branktwo
      output_col: 'btag_discriminant'

    - module_name: SimpleHistogram
      hist_name: BtagDisc
      input_cols: ['btag_discriminant']
      axes:
        - name: "BtagDisc"
          start: 0.0
          stop: 1.0
          bins: 50
          unit: score

    - module_name: SelectOnColumns
      sel_name: 'TwoTightBJets'

event_collections:
  - dataset: '*signal_2023_postBPix_312*900*official'
    pipelines: [quad_pipeline]
location_priorities: [".*(T0|T1|T2).*","eos"] 

Postprocessing:
  processors:
    - name: RatioPlot
      inputs:
        - "*/*/*/PT4"
      ratio_type: 'efficiency'
      structure: 
        group: {dataset_name: "*"}
        subgroups:
          numerator: 
            transforms:
              - name: SelectAxesValues
                select_axes_values: {"variation": ["central"],"PassQuad":[1]}
          denominator: 
            transforms:
              - name: SelectAxesValues
                select_axes_values: {"variation": "central"}
              - name: MergeAxes
                merge_axis_names: {"PassQuad"}
      output_name: "{prefix}/pt_fourth_jet_plots/{dataset_name}/ratio_{era.name}.png"

